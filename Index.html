<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Честный знак">
<meta name="theme-color" content="#0f0f13">
<title>Честный знак — Сканер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: rgba(255,255,255,0.08);
    --accent: #7c4dff;
    --accent2: #9f72ff;
    --text: #f0eeff;
    --muted: rgba(240,238,255,0.45);
    --success: #22c979;
    --warning: #f5a623;
    --danger: #ff4d6d;
    --font: 'Golos Text', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --r: 16px;
    --r-lg: 24px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    padding-top: calc(16px + env(safe-area-inset-top));
    z-index: 10;
    position: relative;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .history-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }

  /* Camera */
  .camera-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  #canvas { display: none; }

  /* Overlay */
  .scan-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .scan-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 48%, transparent 0%, rgba(0,0,0,0.55) 100%);
  }
  .scan-frame {
    position: relative;
    width: min(65vw, 260px);
    height: min(65vw, 260px);
    margin-bottom: 40px;
  }
  .scan-frame::before,
  .scan-frame::after,
  .sf-bl::before,
  .sf-bl::after {
    content: '';
    position: absolute;
    width: 30px; height: 30px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
  }
  .scan-frame::before { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-radius: 4px 0 0 0; }
  .scan-frame::after  { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-radius: 0 4px 0 0; }
  .sf-bl::before { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 4px; }
  .sf-bl::after  { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 4px 0; }

  .scan-line {
    position: absolute;
    left: 4px; right: 4px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    animation: scanline 2s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes scanline {
    0%   { top: 8%; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { top: 92%; opacity: 0; }
  }

  .scan-hint {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }

  /* Controls */
  .controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 5;
  }
  .ctrl-btn {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: rgba(24,24,31,0.85);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.15s;
  }
  .ctrl-btn.active { background: rgba(124,77,255,0.4); border-color: var(--accent); }

  /* Result panel */
  .result-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(15,15,19,0.98) 80%, transparent);
    z-index: 10;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .result-panel.visible { transform: translateY(0); }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--status-color, var(--accent));
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  .result-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 14px;
  }
  .result-icon {
    font-size: 32px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .result-title {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--status-color, var(--text));
  }
  .result-code {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    word-break: break-all;
  }
  .result-close {
    position: absolute;
    top: 14px; right: 14px;
    background: var(--surface2);
    border: none;
    color: var(--muted);
    width: 28px; height: 28px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .result-details {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
  }
  .detail-label {
    color: var(--muted);
    min-width: 80px;
    font-size: 12px;
    font-family: var(--mono);
    padding-top: 1px;
  }
  .detail-value {
    color: var(--text);
    font-weight: 500;
    flex: 1;
  }

  /* History panel */
  .history-panel {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 20;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .history-panel.visible { transform: translateX(0); }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .history-header h2 { font-size: 17px; font-weight: 600; }
  .history-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 16px;
  }
  .history-empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 60px;
    font-family: var(--mono);
  }
  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hi-icon { font-size: 26px; flex-shrink: 0; }
  .hi-info { flex: 1; min-width: 0; }
  .hi-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hi-code { font-size: 10px; font-family: var(--mono); color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hi-time { font-size: 11px; font-family: var(--mono); color: var(--muted); flex-shrink: 0; text-align: right; }

  /* Loading spinner */
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Camera off state */
  .cam-off {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
  }
  .cam-off-icon { font-size: 56px; opacity: 0.4; }
  .cam-off h3 { font-size: 18px; font-weight: 600; }
  .cam-off p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .cam-start-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 16px;
    font-family: var(--font);
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <div class="logo-icon">📦</div>
      <div>
        <h1>Честный знак</h1>
        <div class="header-sub" id="status-text">инициализация...</div>
      </div>
    </div>
    <button class="history-btn" onclick="openHistory()">🕐 История</button>
  </div>

  <!-- Camera -->
  <div class="camera-wrap" id="camera-wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div class="scan-overlay" id="scan-overlay" style="display:none">
      <div class="scan-frame">
        <div class="sf-bl"></div>
        <div class="scan-line"></div>
        <div class="scan-hint">Data Matrix · QR · EAN</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="torch-btn" onclick="toggleTorch()" title="Фонарик" style="display:none">🔦</button>
      <button class="ctrl-btn" id="flip-btn" onclick="flipCamera()" title="Перевернуть">🔄</button>
    </div>

    <div class="cam-off" id="cam-off">
      <div class="cam-off-icon">📷</div>
      <h3>Нужен доступ к камере</h3>
      <p>Нажми кнопку ниже, затем разреши доступ к камере в появившемся окне</p>
      <button class="cam-start-btn" onclick="startCamera()">Включить камеру</button>
    </div>
  </div>

  <!-- Result panel -->
  <div class="result-panel" id="result-panel">
    <div class="result-card" id="result-card">
      <button class="result-close" onclick="closeResult()">✕</button>
      <div class="result-top">
        <div id="result-icon" class="result-icon">⏳</div>
        <div>
          <div class="result-title" id="result-title">Проверяем...</div>
          <div class="result-code" id="result-code"></div>
        </div>
      </div>
      <div class="result-details" id="result-details"></div>
    </div>
  </div>

  <!-- History panel -->
  <div class="history-panel" id="history-panel">
    <div class="history-header">
      <h2>🕐 История сканирований</h2>
      <button class="result-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let stream = null;
  let scanning = false;
  let animFrame = null;
  let isProcessing = false;
  let lastCode = '';
  let lastCodeTime = 0;
  let facingMode = 'environment';
  let torchTrack = null;
  let history = JSON.parse(localStorage.getItem('cz_history') || '[]');

  const video    = document.getElementById('video');
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d', { willReadFrequently: true });
  const overlay  = document.getElementById('scan-overlay');
  const camOff   = document.getElementById('cam-off');
  const statusEl = document.getElementById('status-text');

  // ── Camera ─────────────────────────────────────────────────────────────────
  async function startCamera() {
    try {
      if (stream) { stream.getTracks().forEach(t => t.stop()); }

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;
      await video.play();

      camOff.style.display = 'none';
      overlay.style.display = 'flex';
      scanning = true;
      setStatus('готов к сканированию');
      checkTorch();
      scanLoop();
    } catch (e) {
      setStatus('нет доступа к камере');
      camOff.querySelector('p').textContent = 'Разреши доступ к камере в настройках Safari: Настройки → Safari → Камера → Разрешить';
    }
  }

  function scanLoop() {
    if (!scanning) return;
    animFrame = requestAnimationFrame(scanLoop);
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    if (isProcessing) return;

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const result = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });

    if (result && result.data) {
      const code = result.data;
      const now = Date.now();
      if (code !== lastCode || now - lastCodeTime > 4000) {
        lastCode = code;
        lastCodeTime = now;
        onCodeFound(code);
      }
    }
  }

  async function flipCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    await startCamera();
  }

  function checkTorch() {
    const track = stream && stream.getVideoTracks()[0];
    if (track) {
      const caps = track.getCapabilities();
      if (caps && caps.torch) {
        torchTrack = track;
        document.getElementById('torch-btn').style.display = 'flex';
      }
    }
  }

  async function toggleTorch() {
    if (!torchTrack) return;
    const btn = document.getElementById('torch-btn');
    const on = btn.classList.toggle('active');
    await torchTrack.applyConstraints({ advanced: [{ torch: on }] });
  }

  // ── Code handler ───────────────────────────────────────────────────────────
  function onCodeFound(code) {
    isProcessing = true;
    if (navigator.vibrate) navigator.vibrate(60);

    showResult('spinner', 'Проверяем...', code, '#9f72ff', []);
    checkAPI(code);
  }

  // ── API ────────────────────────────────────────────────────────────────────
  async function checkAPI(code) {
    try {
      const res = await fetch('https://mobile.api.crpt.ru/mobile/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
        signal: AbortSignal.timeout(10000)
      });

      if (res.status === 404) {
        showResult('❌', 'Код не найден', code, '#ff4d6d', []);
        saveHistory({ code, icon: '❌', title: 'Не найден', time: Date.now() });
        isProcessing = false;
        return;
      }

      if (!res.ok) {
        showResult('⚠️', `Ошибка сервера: ${res.status}`, code, '#f5a623', []);
        isProcessing = false;
        return;
      }

      const data = await res.json();

      if (!data.found) {
        showResult('❌', 'Товар не найден в системе', code, '#ff4d6d', []);
        saveHistory({ code, icon: '❌', title: 'Не найден', time: Date.now() });
        isProcessing = false;
        return;
      }

      const sold = data.saleStatus === 'sold';
      const legal = (data.status === 'introduced' || data.status === 'applied') && !sold;

      let icon  = legal ? '✅' : (sold ? '⚠️' : '❌');
      let title = legal ? 'Легальный товар' : (sold ? 'Товар уже продан' : (data.status || 'Неизвестный статус'));
      let color = legal ? '#22c979' : (sold ? '#f5a623' : '#ff4d6d');

      const details = [];
      if (data.name)           details.push({ label: 'Товар',     value: data.name });
      if (data.brand)          details.push({ label: 'Бренд',     value: data.brand });
      if (data.expirationDate) details.push({ label: 'Срок',      value: data.expirationDate });
      if (data.status)         details.push({ label: 'Статус',    value: statusLabel(data.status) });

      showResult(icon, title, code, color, details);
      saveHistory({ code, icon, title: data.name || title, time: Date.now() });

    } catch (e) {
      const msg = e.name === 'TimeoutError' ? 'Таймаут соединения' : 'Нет соединения с интернетом';
      showResult('⚠️', msg, code, '#f5a623', []);
    } finally {
      setTimeout(() => { isProcessing = false; }, 3000);
    }
  }

  function statusLabel(s) {
    const map = { introduced: 'В обороте', applied: 'Нанесён', retired: 'Выведен' };
    return map[s] || s;
  }

  // ── Result UI ──────────────────────────────────────────────────────────────
  function showResult(icon, title, code, color, details) {
    const card = document.getElementById('result-card');
    card.style.setProperty('--status-color', color);

    const iconEl = document.getElementById('result-icon');
    if (icon === 'spinner') {
      iconEl.innerHTML = '<div class="spinner"></div>';
    } else {
      iconEl.textContent = icon;
    }

    document.getElementById('result-title').textContent = title;
    document.getElementById('result-title').style.color = color;
    document.getElementById('result-code').textContent = code.length > 50 ? code.slice(0, 50) + '…' : code;

    const det = document.getElementById('result-details');
    det.innerHTML = '';
    details.forEach(d => {
      const row = document.createElement('div');
      row.className = 'detail-row';
      row.innerHTML = `<span class="detail-label">${d.label}</span><span class="detail-value">${d.value}</span>`;
      det.appendChild(row);
    });
    if (details.length === 0) det.style.display = 'none';
    else det.style.display = 'flex';

    document.getElementById('result-panel').classList.add('visible');
  }

  function closeResult() {
    document.getElementById('result-panel').classList.remove('visible');
    isProcessing = false;
    lastCode = '';
  }

  // ── History ────────────────────────────────────────────────────────────────
  function saveHistory(item) {
    history.unshift(item);
    if (history.length > 100) history = history.slice(0, 100);
    localStorage.setItem('cz_history', JSON.stringify(history));
  }

  function openHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    if (history.length === 0) {
      list.innerHTML = '<div class="history-empty">Нет сканирований</div>';
    } else {
      history.forEach(h => {
        const t = new Date(h.time);
        const timeStr = t.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) + '\n' + t.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
        const el = document.createElement('div');
        el.className = 'history-item';
        el.innerHTML = `
          <div class="hi-icon">${h.icon}</div>
          <div class="hi-info">
            <div class="hi-name">${h.title}</div>
            <div class="hi-code">${h.code.slice(0, 40)}${h.code.length > 40 ? '…' : ''}</div>
          </div>
          <div class="hi-time" style="white-space:pre">${timeStr}</div>`;
        list.appendChild(el);
      });
    }
    document.getElementById('history-panel').classList.add('visible');
  }

  function closeHistory() {
    document.getElementById('history-panel').classList.remove('visible');
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function setStatus(text) { statusEl.textContent = text; }

  // Auto-start
  window.addEventListener('load', () => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      startCamera();
    } else {
      setStatus('браузер не поддерживается');
    }
  });
</script>
</body>
</html>
